<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Destapando el Arte</title>
<style>
:root{--bg:#e9e8e2;--bg2:#fbfaf6;--fg:#1d1a26;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141a;--bg2:#2c2a33;--fg:#f1eee6}}
:root[data-theme="dark"]{--bg:#15141a;--bg2:#2c2a33;--fg:#f1eee6}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 55%,var(--bg2),var(--bg) 70%);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden;position:relative}
.grain{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.22;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .3  0 0 0 .6 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.hills{position:absolute;left:0;right:0;bottom:0;height:20%;z-index:0;background:linear-gradient(#8a8a90,#4a4a52);opacity:.45;clip-path:polygon(0 40%,15% 25%,35% 38%,55% 18%,78% 34%,100% 15%,100% 100%,0 100%)}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
svg.main{height:94%;max-width:100%;position:relative;z-index:2;overflow:visible}
.blob{position:absolute;border-radius:50%;opacity:0;transform:scale(0);z-index:1;filter:url(#rough);mix-blend-mode:multiply}
.play .blob{animation:burst 1.4s cubic-bezier(.1,.9,.25,1) var(--d) forwards}
@keyframes burst{0%{transform:scale(0);opacity:0}25%{opacity:.75}100%{transform:scale(1);opacity:.5}}
.it{opacity:0;transform-box:fill-box;transform-origin:50% 100%;filter:url(#sh)}
.play .it{animation:pop 1.5s cubic-bezier(.3,.7,.3,1) var(--d) forwards,bob 4s ease-in-out calc(var(--d) + 1.6s) infinite alternate}
@keyframes pop{0%{opacity:0;transform:translate(0,170px) scale(.5) rotate(0)}10%{opacity:1}55%{opacity:1;transform:translate(var(--x,0),var(--o,-70px)) scale(1.06) rotate(calc(var(--r)*1.8))}100%{opacity:1;transform:translate(0,0) scale(1) rotate(var(--r))}}
@keyframes bob{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-7px) rotate(calc(var(--r) + 1.5deg))}}
.swirl{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);opacity:0}
.play .swirl{animation:rise 1.4s cubic-bezier(.2,.8,.3,1) 1.2s forwards}
@keyframes rise{to{transform:scaleY(1);opacity:1}}
#lid{transform-box:fill-box;transform-origin:50% 50%;filter:url(#sh)}
.play #lid{animation:lid 2.4s cubic-bezier(.4,0,.6,1) .2s forwards}
@keyframes lid{0%,8%{transform:none}12%{transform:translateY(-3px) rotate(-2deg)}16%{transform:translateY(0) rotate(2deg)}20%{transform:translateY(-5px) rotate(-1.5deg) scale(1.01)}30%{transform:translate(8px,-50px) rotate(-14deg) scale(1,.8)}55%{transform:translate(70px,-210px) rotate(20deg) scale(1,.45);opacity:1}100%{transform:translate(160px,-120px) rotate(150deg) scale(1,.7);opacity:0}}
#can{transform-box:fill-box;transform-origin:50% 100%}
.play #can{animation:squash .7s ease-out 1s}
@keyframes squash{0%{transform:scale(1)}25%{transform:scale(1.035,.955)}60%{transform:scale(.99,1.02)}100%{transform:scale(1)}}
.title{opacity:0;font-size:46px;letter-spacing:1.5px}
.play .title{animation:fade 1.8s ease 3s forwards}
@keyframes fade{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
button{position:absolute;z-index:5;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:99px;border:1px solid var(--fg);background:transparent;color:var(--fg);font:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){.play *{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>

<g class="it" style="--d:1.35s;--r:10deg;--o:-120px;--x:10px"><path d="M346 150q-8 26-2 52l24-4q6-26-2-54z" fill="#2a9d95" stroke="#18312f" stroke-width="2.5"/><path d="M350 156q-4 18 0 36" stroke="#e8306f" stroke-width="5" fill="none"/><path d="M356 158q8 10 4 34" stroke="#ffb020" stroke-width="5" fill="none"/><path d="M344 202l26-5-3 26-24 5z" fill="url(#steel)" stroke="#3b3f48" stroke-width="2.5"/><path d="M345 222l22-5 6 100q2 12-8 14t-14-12z" fill="url(#wood)" stroke="#3a2008" stroke-width="2.5" transform="translate(-2 6)"/></g>

<g class="it" style="--d:1.5s;--r:6deg;--o:-100px;--x:20px"><circle cx="440" cy="270" r="47" fill="url(#reel)" stroke="#2b2735" stroke-width="3.5"/><circle cx="440" cy="270" r="40" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><g fill="#1b1a22"><circle cx="440" cy="270" r="10"/><circle cx="440" cy="243" r="10"/><circle cx="440" cy="297" r="10"/><circle cx="413" cy="270" r="10"/><circle cx="467" cy="270" r="10"/></g><circle cx="440" cy="270" r="3.5" fill="#9a9ea9"/></g>

<g class="it" style="--d:1.45s;--r:-52deg;--o:-90px;--x:30px"><path d="M358 292h74l12 4v22l-12 4h-74q-8-15 0-30z" fill="url(#cyan)" stroke="#0f3b3f" stroke-width="2.5"/><rect x="440" y="294" width="22" height="26" rx="3" fill="url(#steel)" stroke="#3b3f48" stroke-width="2.5"/><path d="M366 296h66" stroke="#fff" stroke-opacity=".6" stroke-width="3"/><text x="378" y="313" font-size="13" fill="#0b2c30" font-family="sans-serif" font-weight="700">Cian</text></g>

<g class="it" style="--d:1.6s;--r:-32deg;--o:-80px;--x:30px"><path d="M372 338h76l12 4v22l-12 4h-76q-8-15 0-30z" fill="url(#pink)" stroke="#4a0a22" stroke-width="2.5"/><rect x="458" y="340" width="22" height="26" rx="3" fill="url(#steel)" stroke="#3b3f48" stroke-width="2.5"/><path d="M380 342h66" stroke="#fff" stroke-opacity=".6" stroke-width="3"/></g>

<g id="can">
<path d="M195 388Q300 432 405 388V548Q405 592 300 592T195 548Z" fill="url(#tin)" stroke="#3a3744" stroke-width="3"/>
<path d="M195 388Q300 432 405 388V548Q405 592 300 592T195 548Z" fill="url(#rib)"/>
<g fill="none"><path d="M197 428Q300 470 403 428" stroke="#fff" stroke-opacity=".75" stroke-width="3"/><path d="M197 433Q300 475 403 433" stroke="#000" stroke-opacity=".28" stroke-width="3"/>
<path d="M197 464Q300 506 403 464" stroke="#fff" stroke-opacity=".75" stroke-width="3"/><path d="M197 469Q300 511 403 469" stroke="#000" stroke-opacity=".28" stroke-width="3"/>
<path d="M197 500Q300 542 403 500" stroke="#fff" stroke-opacity=".75" stroke-width="3"/><path d="M197 505Q300 547 403 505" stroke="#000" stroke-opacity=".28" stroke-width="3"/>

<path d="M195 388Q300 432 405 388" fill="none" stroke="#fff" stroke-width="5" stroke-opacity=".9"/>
<path d="M195 388Q300 432 405 388" fill="none" stroke="#2a2733" stroke-width="2"/>

<g id="lid"><ellipse cx="300" cy="388" rx="108" ry="25" fill="url(#steel)" stroke="#2b2735" stroke-width="3.5"/><ellipse cx="300" cy="388" rx="84" ry="17" fill="none" stroke="#2b2735" stroke-opacity=".5" stroke-width="2"/><ellipse cx="300" cy="386" rx="80" ry="15" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><ellipse cx="272" cy="387" rx="28" ry="7" fill="#b7bbc5" stroke="#2b2735" stroke-width="2.5"/><circle cx="244" cy="386" r="10" fill="none" stroke="#868a95" stroke-width="4"/><circle cx="244" cy="386" r="10" fill="none" stroke="#2b2735" stroke-width="1.2"/></g>

<g id="parts"></g>
<text class="title" x="300" y="700" text-anchor="middle" fill="currentColor">Destapando el Arte</text>
</svg>
<button id="re">Repetir</button>
</div>
<div class="grain"></div>
<script>
var r=document.getElementById('root'),P=document.getElementById('parts'),NS='http://www.w3.org/2000/svg',raf,tm;
var cols=['#e8306f','#1fb8aa','#ffb020','#6a4cff','#7bd957','#3aa0ff'];
function spray(){
  P.innerHTML='';var ps=[];
  for(var i=0;i<46;i++){
    var c=document.createElementNS(NS,'circle'),s=2+Math.random()*5;
    c.setAttribute('r',s);c.setAttribute('fill',cols[i%6]);c.setAttribute('opacity',0);P.appendChild(c);
    var a=-Math.PI/2+(Math.random()-.5)*1.5,v=9+Math.random()*10;
    ps.push({c:c,x:230+Math.random()*140,y:386,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,e:Math.random()*.4});
  }
  var t0=performance.now();
  (function f(t){
    var d=(t-t0)/1000,alive=false;
    ps.forEach(function(p){
      if(d<1.2+p.e){alive=true;return}
      if(p.l<=0)return;alive=true;
      p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.l-=.012;
      p.c.setAttribute('cx',p.x);p.c.setAttribute('cy',p.y);p.c.setAttribute('opacity',Math.max(p.l,0));
    });
    if(alive)raf=requestAnimationFrame(f);
  })(t0);
}
function go(){
  cancelAnimationFrame(raf);r.classList.remove('play');void r.offsetWidth;r.classList.add('play');spray();
}
document.getElementById('re').onclick=go;
r.onclick=function(e){if(e.target.tagName!=='BUTTON')go()};
go();
</script>
